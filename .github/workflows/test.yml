name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt

      # Lint is scoped to tests/: the integration and scripts carry
      # pre-existing ruff debt, and the generated protobuf files are
      # excluded from linting in pyproject.toml.
      - name: Lint tests
        run: |
          ruff check tests
          ruff format --check tests

      - name: Test
        run: pytest tests/ -q
